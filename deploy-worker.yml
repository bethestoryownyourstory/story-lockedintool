name: Deploy Lockedintool release server
# Puts release-worker.js on Cloudflare as the "lockedintool-release" Worker - no code editor needed.
# Runs when release-worker.js changes, or Actions -> this workflow -> Run workflow.
# Needs two repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - Cloudflare API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account ID
# The Worker's own PIN and GITHUB_TOKEN secrets stay in Cloudflare and are kept on every deploy.
on:
  push:
    branches: [main]
    paths: ['release-worker.js', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare secrets are set
        id: ready
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "### Not deployed: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings -> Secrets and variables -> Actions." >> "$GITHUB_STEP_SUMMARY"; fi
      # The old-server fallback is gone (owner added both secrets, 5 Nov 2026) - never deploy without them, or the
      # owner PIN and Publish live update would stop working. Only the secrets' NAMES are read, never their values.
      - name: Check PIN and GITHUB_TOKEN are set on lockedintool-release
        if: steps.ready.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(npx -y wrangler@3 secret list --name lockedintool-release 2>&1 || true)
          # Only names come back (wrangler never shows a secret's value); printed so a problem is visible.
          echo "$out" | grep -v -i 'token\|key' | tail -n 20
          names=$(echo "$out" | grep -o '"name": *"[^"]*"' | sed 's/.*"\([^"]*\)"$/\1/' | tr '\n' ' ')
          echo "Secrets on lockedintool-release: $names"
          for n in PIN GITHUB_TOKEN; do
            echo " $names " | grep -q " $n " || { echo "### Not deployed: $n is missing on lockedintool-release (Cloudflare -> Workers & Pages -> lockedintool-release -> Settings -> Variables and Secrets)." >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          done
          echo "### lockedintool-release has PIN and GITHUB_TOKEN" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy to Cloudflare
        if: steps.ready.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy release-worker.js --name lockedintool-release --compatibility-date 2025-01-01
