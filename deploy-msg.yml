name: Deploy STORY message server
# Puts msg-worker.js on Cloudflare as the "story-msg" Worker (STORY's messages + calls: accounts made by the phone,
# locked messages, call set-up; phone verification by text code) - settings in msg-wrangler.toml. Runs when the server changes, or Actions -> Run workflow.
# Needs repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID - the same ones the release server uses
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN - Twilio
#   TWILIO_FROM (STORY's Twilio number) or TWILIO_VERIFY_SID - only for verifying a phone number when STORY needs to.
#     TWILIO_FROM also sends password-reset links by text message.
#   RESEND_API_KEY + MAIL_FROM (e.g. "Lockedintool <no-reply@yourdomain>") - Resend (resend.com), for the emails Lockedintool
#     sends: password-reset links, codes to check a private email, Delete account confirmations.
#   PAYSTACK_SECRET_KEY - the Paystack merchant account (owner, Oct 2026): Basic / Premium as real monthly Paystack
#     subscriptions. Test key (sk_test_...) first, then the live one (sk_live_...). In Paystack's dashboard set the
#     Webhook URL to https://story-msg.<your workers subdomain>.workers.dev/v1/paystack/hook (monthly renewals).
#     When it is set, plans use Paystack; without it they use Stitch Express as before.
#   STITCH_CLIENT_ID, STITCH_CLIENT_SECRET - Stitch EXPRESS (subscriptions: payment links into LOCKED IN TOOL's balance);
#   STITCH_ENT_CLIENT_ID, STITCH_ENT_CLIENT_SECRET - a payout partner (Stitch Enterprise) for sending money to other people;
#   SUB_BASIC_ZAR / SUB_PREMIUM_ZAR (optional) - the monthly prices in rand ($5 / $15; default R95 / R285).
#   SUB_ENFORCE (optional) - set to 1 to switch the paywall on (no plan = only the Subscription page). Leave it unset
#                until the LIVE Stitch keys are in.
#   REALTIME_APP_ID + REALTIME_APP_SECRET (optional) - Live video (Cloudflare Realtime). Without them the deploy makes the
#     app itself, which needs the Cloudflare token to have the 'Calls' (Realtime): Edit permission.
#   TURN_KEY_ID + TURN_KEY_TOKEN (optional) - the calls relay (Cloudflare TURN), so calls connect on mobile data. Without
#     them the deploy makes the TURN key itself, which needs the same 'Calls' (Realtime): Edit permission.
#   STITCH_REDIRECT (optional) - the page Stitch returns to after you approve a payment (default: this server's /v1/pay/return).
on:
  push:
    branches: [main]
    paths: ['msg-worker.js', 'msg-wrangler.toml', '.github/workflows/deploy-msg.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the secrets are set
        id: ready
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          F: ${{ secrets.TWILIO_FROM }}
          V: ${{ secrets.TWILIO_VERIFY_SID }}
          S: ${{ secrets.STITCH_CLIENT_ID }}
          PK: ${{ secrets.PAYSTACK_SECRET_KEY }}
        run: |
          if [ -n "$T" ] && [ -n "$A" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "### Not deployed: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings -> Secrets and variables -> Actions." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -z "$F" ] && [ -z "$V" ]; then echo "### Phone verification texts wait for TWILIO_FROM (only needed when STORY verifies something)." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -z "$PK" ]; then echo "### Plans wait for PAYSTACK_SECRET_KEY (the Paystack merchant account)." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -z "$S" ]; then echo "### Money transfer waits for STITCH_CLIENT_ID + STITCH_CLIENT_SECRET (Stitch)." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Deploy to Cloudflare
        if: steps.ready.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy -c msg-wrangler.toml
      - name: Give the server its keys (only the ones that are set)
        if: steps.ready.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_VERIFY_SID: ${{ secrets.TWILIO_VERIFY_SID }}
          PHONE_SALT: ${{ secrets.PHONE_SALT }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          STITCH_CLIENT_ID: ${{ secrets.STITCH_CLIENT_ID }}
          STITCH_CLIENT_SECRET: ${{ secrets.STITCH_CLIENT_SECRET }}
          STITCH_REDIRECT: ${{ secrets.STITCH_REDIRECT }}
          STITCH_ENT_CLIENT_ID: ${{ secrets.STITCH_ENT_CLIENT_ID }}
          STITCH_ENT_CLIENT_SECRET: ${{ secrets.STITCH_ENT_CLIENT_SECRET }}
          SUB_BASIC_ZAR: ${{ secrets.SUB_BASIC_ZAR }}
          SUB_PREMIUM_ZAR: ${{ secrets.SUB_PREMIUM_ZAR }}
          SUB_ENFORCE: ${{ secrets.SUB_ENFORCE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          REALTIME_APP_ID: ${{ secrets.REALTIME_APP_ID }}
          REALTIME_APP_SECRET: ${{ secrets.REALTIME_APP_SECRET }}
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_TOKEN: ${{ secrets.TURN_KEY_TOKEN }}
        run: |
          for k in TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_FROM TWILIO_VERIFY_SID PHONE_SALT PAYSTACK_SECRET_KEY STITCH_CLIENT_ID STITCH_CLIENT_SECRET STITCH_REDIRECT STITCH_ENT_CLIENT_ID STITCH_ENT_CLIENT_SECRET SUB_BASIC_ZAR SUB_PREMIUM_ZAR SUB_ENFORCE RESEND_API_KEY MAIL_FROM REALTIME_APP_ID REALTIME_APP_SECRET TURN_KEY_ID TURN_KEY_TOKEN; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s' "$v" | npx --yes wrangler@4 secret put "$k" -c msg-wrangler.toml >/dev/null && echo "$k set"; fi
          done
          # Problem reports: the key the check-up (problems.yml) reads them with - made from the Cloudflare token, never stored anywhere.
          printf 'lit-problems:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-48 | tr -d '\n' | npx --yes wrangler@4 secret put PROBLEMS_KEY -c msg-wrangler.toml >/dev/null && echo "PROBLEMS_KEY set"
      - name: Live video (Cloudflare Realtime) - made once on this Cloudflare account
        if: steps.ready.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The server says whether it already has its live video keys; if not, a Realtime app is made (any old one
          # with the same name is removed first, since its secret can't be read back) and its keys go to the server.
          sleep 4
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain | python3 -c 'import sys,json; print(json.load(sys.stdin)["result"]["subdomain"])')
          LIVE=$(curl -s https://story-msg.$SUB.workers.dev/v1/health | python3 -c 'import sys,json; print(json.load(sys.stdin).get("live"))' || echo False)
          if [ "$LIVE" = "True" ]; then echo "Live video: already set up"; exit 0; fi
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/calls/apps
          for id in $(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API | python3 -c 'import sys,json; d=json.load(sys.stdin); print(" ".join(a["uid"] for a in (d.get("result") or []) if a.get("name")=="lockedintool-live"))'); do
            curl -s -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API/$id >/dev/null
          done
          R=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d '{"name":"lockedintool-live"}' $API)
          APP=$(echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print((d.get("result") or {}).get("uid",""))')
          SEC=$(echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print((d.get("result") or {}).get("secret",""))')
          if [ -z "$APP" ] || [ -z "$SEC" ]; then
            echo "Live video could not be set up: $(echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("errors"))')" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "The Cloudflare API token needs the 'Calls' (Realtime) permission: Edit for this account." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::add-mask::$SEC"
          printf '%s' "$APP" | npx --yes wrangler@4 secret put REALTIME_APP_ID -c msg-wrangler.toml >/dev/null && echo "REALTIME_APP_ID set"
          printf '%s' "$SEC" | npx --yes wrangler@4 secret put REALTIME_APP_SECRET -c msg-wrangler.toml >/dev/null && echo "REALTIME_APP_SECRET set"
      - name: Calls relay (Cloudflare TURN) - made once on this Cloudflare account
        if: steps.ready.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Calls on mobile data need a relay (the carrier's NAT stops two phones reaching each other with STUN alone).
          # The server says whether it already has its TURN key; if not, one is made (any old one with the same name is
          # removed first, since its secret can't be read back) and its id + secret go to the server. Never fails the deploy.
          set +e
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain | python3 -c 'import sys,json; print(json.load(sys.stdin)["result"]["subdomain"])' 2>/dev/null)
          TURN=$(curl -s https://story-msg.$SUB.workers.dev/v1/health | python3 -c 'import sys,json; print(json.load(sys.stdin).get("turn"))' 2>/dev/null)
          if [ "$TURN" = "True" ]; then echo "Calls relay: already set up"; exit 0; fi
          if [ -z "$TURN" ]; then echo "Calls relay: the server didn't answer - it is set up on the next deploy" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/calls/turn_keys
          for id in $(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API | python3 -c 'import sys,json; d=json.load(sys.stdin); print(" ".join(k["uid"] for k in (d.get("result") or []) if k.get("name")=="lockedintool-turn"))' 2>/dev/null); do
            curl -s -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API/$id >/dev/null
          done
          R=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d '{"name":"lockedintool-turn"}' $API)
          KID=$(echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print((d.get("result") or {}).get("uid",""))' 2>/dev/null)
          KEY=$(echo "$R" | python3 -c 'import sys,json; d=json.load(sys.stdin); print((d.get("result") or {}).get("key",""))' 2>/dev/null)
          if [ -z "$KID" ] || [ -z "$KEY" ]; then
            echo "Calls relay could not be set up: the Cloudflare API token needs the 'Calls' (Realtime): Edit permission." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Cloudflare said: $(echo "$R" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("errors"))' 2>/dev/null)"
            exit 0
          fi
          echo "::add-mask::$KEY"
          printf '%s' "$KID" | npx --yes wrangler@4 secret put TURN_KEY_ID -c msg-wrangler.toml >/dev/null && echo "TURN_KEY_ID set"
          printf '%s' "$KEY" | npx --yes wrangler@4 secret put TURN_KEY_TOKEN -c msg-wrangler.toml >/dev/null && echo "TURN_KEY_TOKEN set"
          exit 0
      - name: Check it answers
        if: steps.ready.outputs.ok == 'true'
        run: |
          sleep 5
          curl -s https://story-msg.$(curl -s -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/subdomain | python3 -c 'import sys,json; print(json.load(sys.stdin)["result"]["subdomain"])').workers.dev/v1/health?pay=1 | tee -a "$GITHUB_STEP_SUMMARY"
