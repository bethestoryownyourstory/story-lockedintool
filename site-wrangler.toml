# Lockedintool's website (site-build.mjs builds it into _site; deploy-site.yml puts it on Cloudflare).
# https://lockedintool.com (the owner's own domain, bought on Cloudflare - owner: 'I bought the domain lockedintool.com'),
# www.lockedintool.com and https://lockedintool.<workers subdomain>.workers.dev.
name = "lockedintool"
compatibility_date = "2025-01-01"
workers_dev = true
routes = [{ pattern = "lockedintool.com", custom_domain = true, zone_name = "lockedintool.com" }, { pattern = "www.lockedintool.com", custom_domain = true, zone_name = "lockedintool.com" }]

[assets]
directory = "./_site"
not_found_handling = "404-page"
