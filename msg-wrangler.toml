# Lockedintool's message + call server (msg-worker.js), deployed by deploy-msg.yml.
name = "lockedintool-msg"
main = "msg-worker.js"
compatibility_date = "2025-01-01"

# What people see in links / pages (owner: no 'story' in anything about Lockedintool) - site-worker.js passes it on here.
[vars]
PUBLIC_BASE = "https://api.lockedintool.com"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# File stores: the bytes of pictures / videos, spread over many stores (msg-worker.js storeOf).
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

# SQLite-backed Durable Objects (work on Cloudflare's free plan). They were made in the server's old name ("story-msg",
# migrations v1 = Hub, v2 = Store); renaming the server (owner, 4 Nov 2026: plan B step 3 - nothing named Story) MOVES
# them, data and all, into this one - Cloudflare's own transfer, nothing is copied by hand. Never remove this migration.
[[migrations]]
tag = "v1"
transferred_classes = [ { from = "Hub", from_script = "story-msg", to = "Hub" }, { from = "Store", from_script = "story-msg", to = "Store" } ]
