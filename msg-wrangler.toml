# STORY's message + call server (msg-worker.js), deployed by deploy-msg.yml.
name = "story-msg"
main = "msg-worker.js"
compatibility_date = "2025-01-01"

# What people see in links / pages (owner: no 'story' in anything about Lockedintool) - site-worker.js passes it on here.
[vars]
PUBLIC_BASE = "https://api.lockedintool.com"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

# File stores: the bytes of pictures / videos, spread over many stores (msg-worker.js storeOf).
[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

# SQLite-backed Durable Object (works on Cloudflare's free plan).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Store"]
