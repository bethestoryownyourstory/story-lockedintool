name: STORY screens - Test, then Approve
# Nothing reaches users until the owner says yes (owner's rule):
#   push            -> the Test channel only (gh-pages /preview/ = the owner's phone).
#   Run workflow    -> action:
#     publish = the owner's "Publish live update": the Test screens go to everyone (/) AND the Test app build
#               ("latest" release) is copied to the "live" release - everything goes together; the screens it
#               replaces are kept in /prev/.
#     undo    = the owner's "Undo last update": the screens from before the last publish come back for everyone.
#     launch  = going public: publish + the download page for new users (/get/). Only when the owner says yes.
on:
  push:
    paths: ['index.html', 'manifest.json', 'icon-192.png', 'icon-512.png', 'get.html', 'screens.yml']
  workflow_dispatch:
    inputs:
      action:
        description: 'publish | undo | launch'
        required: true
        default: 'publish'
        type: choice
        options: ['publish', 'undo', 'launch']
permissions:
  contents: write
concurrency:
  group: story-screens
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Open the published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add --detach site origin/gh-pages
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rfq .
          fi
          touch site/.nojekyll
          # First run only: live starts as exactly what main serves today.
          if [ ! -f site/index.html ]; then
            git archive origin/main index.html manifest.json icon-192.png icon-512.png | tar -x -C site
            echo "main $(git rev-parse --short origin/main)" > site/live-source.txt
          fi
      - name: New upload -> Test channel
        if: github.event_name == 'push'
        run: |
          mkdir -p site/preview
          cp index.html manifest.json icon-192.png icon-512.png site/preview/
          echo "${GITHUB_REF_NAME} ${GITHUB_SHA::7}" > site/preview/source.txt
          # Not launched yet (owner): no public download page.
          [ -f site/launched.txt ] || rm -rf site/get
          git -C site add -A
          git -C site commit -qm "Test channel: ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" || echo "Nothing new"
          git -C site push origin HEAD:gh-pages
          echo "### On the Test channel now: ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish -> the Test version goes live for everyone (owner said yes)
        if: github.event_name == 'workflow_dispatch' && (inputs.action == 'publish' || inputs.action == 'launch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Screens: keep the version it replaces (for Undo), then /preview/ -> /.
          if [ -f site/preview/index.html ]; then
            if [ -f site/index.html ] && ! cmp -s site/preview/index.html site/index.html; then
              mkdir -p site/prev
              for f in index.html manifest.json icon-192.png icon-512.png; do cp site/$f site/prev/ 2>/dev/null || true; done
              cp site/live-source.txt site/prev/source.txt 2>/dev/null || true
            fi
            for f in index.html manifest.json icon-192.png icon-512.png; do cp site/preview/$f site/ 2>/dev/null || true; done
            cp site/preview/source.txt site/live-source.txt 2>/dev/null || true
          fi
          # The app: the Test build ("latest") becomes the live build (APK first, then version.json).
          mkdir -p rel && gh release download latest -p app-debug.apk -p version.json -D rel --clobber
          N=$(grep -o '[0-9]\+' rel/version.json | head -1)
          if gh release view live >/dev/null 2>&1; then
            gh release upload live rel/app-debug.apk --clobber
            gh release upload live rel/version.json --clobber
            gh release edit live --title "STORY live build $N" --latest
          else
            gh release create live rel/app-debug.apk rel/version.json --title "STORY live build $N" --notes "Live channel: the STORY build every user gets" --latest
          fi
          if [ "${{ inputs.action }}" = "launch" ]; then
            # Going public: the download page for new users.
            mkdir -p site/get && cp get.html site/get/index.html
            echo "launched $(date -u +%F)" > site/launched.txt
          fi
          git -C site add -A
          git -C site commit -qm "Published live: $(cat site/live-source.txt 2>/dev/null), app $N" || echo "Live already matches"
          git -C site push origin HEAD:gh-pages
          echo "### Live for everyone now: screens $(cat site/live-source.txt 2>/dev/null), app build $N" >> "$GITHUB_STEP_SUMMARY"
          # Everything fast: once Pages serves it, the message server tells every phone.
          SRC=$(cut -d' ' -f2 site/live-source.txt 2>/dev/null)
          for i in $(seq 1 60); do
            if curl -sf "https://bethestoryownyourstory.github.io/story-lockedintool/live-source.txt?t=$(date +%s%N)" | grep -q "$SRC"; then break; fi
            sleep 3
          done
          curl -s -X POST https://story-msg.percyjuniormaseko0.workers.dev/v1/release-ping || true
      - name: Undo last update -> the screens from before go back for everyone (owner)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'undo'
        run: |
          if [ ! -f site/prev/index.html ]; then echo "Nothing to undo yet." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          mkdir -p swap
          for f in index.html manifest.json icon-192.png icon-512.png; do
            cp site/$f swap/ 2>/dev/null || true; cp site/prev/$f site/$f 2>/dev/null || true; cp swap/$f site/prev/$f 2>/dev/null || true
          done
          cp site/live-source.txt swap/source.txt 2>/dev/null || true
          cp site/prev/source.txt site/live-source.txt 2>/dev/null || true
          cp swap/source.txt site/prev/source.txt 2>/dev/null || true
          git -C site add -A
          git -C site commit -qm "Undo last update: back to $(cat site/live-source.txt 2>/dev/null)" || echo "Nothing changed"
          git -C site push origin HEAD:gh-pages
          echo "### Undone - everyone is back to: $(cat site/live-source.txt 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
