name: STORY screens - Test, then Approve
# FULLY LIVE (owner's choice): a pushed index.html goes to the Test channel AND straight to everyone (/), no publishing.
# Run workflow (= the owner's "Undo last update" button) puts the screens from before the last update back for everyone.
# Approve (the owner's "Publish live update" button runs this through the release server,
# or Actions -> this workflow -> Run workflow) -> the Test version goes LIVE for everyone:
#   - the app: the "latest" (Test) release build is copied to the "live" release
#   - the screens: gh-pages /preview/ is copied to /  (the site is published from gh-pages)
on:
  push:
    paths: ['index.html', 'manifest.json', 'icon-192.png', 'icon-512.png']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: story-screens
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Open the published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add --detach site origin/gh-pages
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rfq .
          fi
          touch site/.nojekyll
          # First run only: live starts as exactly what main serves today.
          if [ ! -f site/index.html ]; then
            git archive origin/main index.html manifest.json icon-192.png icon-512.png | tar -x -C site
            echo "main $(git rev-parse --short origin/main)" > site/live-source.txt
          fi
      - name: New upload -> Test channel
        if: github.event_name == 'push'
        run: |
          mkdir -p site/preview
          cp index.html manifest.json icon-192.png icon-512.png site/preview/
          echo "${GITHUB_REF_NAME} ${GITHUB_SHA::7}" > site/preview/source.txt
          git -C site add -A
          git -C site commit -qm "Test channel: ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" || echo "Nothing new"
          git -C site push origin HEAD:gh-pages
          echo "### On the Test channel now: ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
      - name: Fully live -> everyone gets it now (owner)
        if: github.event_name == 'push'
        run: |
          # Keep the version it replaces, for Undo last update.
          if [ -f site/index.html ] && ! cmp -s index.html site/index.html; then
            mkdir -p site/prev
            for f in index.html manifest.json icon-192.png icon-512.png; do cp site/$f site/prev/ 2>/dev/null || true; done
            cp site/live-source.txt site/prev/source.txt 2>/dev/null || true
          fi
          cp index.html manifest.json icon-192.png icon-512.png site/
          echo "${GITHUB_REF_NAME} ${GITHUB_SHA::7}" > site/live-source.txt
          git -C site add -A
          git -C site commit -qm "Live: ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" || echo "Live already matches"
          git -C site push origin HEAD:gh-pages
          echo "### Live for everyone now: ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
      - name: Tell every phone at once (everything fast)
        if: github.event_name == 'push'
        run: |
          # Wait until GitHub Pages really serves the new screens, then the message server tells every phone.
          for i in $(seq 1 60); do
            if curl -sf "https://bethestoryownyourstory.github.io/story-lockedintool/live-source.txt?t=$(date +%s%N)" | grep -q "${GITHUB_SHA::7}"; then break; fi
            sleep 3
          done
          curl -s -X POST https://story-msg.percyjuniormaseko0.workers.dev/v1/release-ping || true
      - name: Undo last update -> the screens from before go back for everyone (owner)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ ! -f site/prev/index.html ]; then echo "Nothing to undo yet." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          mkdir -p swap
          for f in index.html manifest.json icon-192.png icon-512.png; do
            cp site/$f swap/ 2>/dev/null || true; cp site/prev/$f site/$f 2>/dev/null || true; cp swap/$f site/prev/$f 2>/dev/null || true
          done
          cp site/live-source.txt swap/source.txt 2>/dev/null || true
          cp site/prev/source.txt site/live-source.txt 2>/dev/null || true
          cp swap/source.txt site/prev/source.txt 2>/dev/null || true
          mkdir -p site/preview && cp site/index.html site/manifest.json site/icon-192.png site/icon-512.png site/preview/ && cp site/live-source.txt site/preview/source.txt
          git -C site add -A
          git -C site commit -qm "Undo last update: back to $(cat site/live-source.txt 2>/dev/null)" || echo "Nothing changed"
          git -C site push origin HEAD:gh-pages
          echo "### Undone - everyone is back to: $(cat site/live-source.txt 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
