name: STORY screens - Test, then Approve
# Push a new index.html -> it goes to the TEST channel only (the owner's phone).
# Approve (the owner's "Publish live update" button runs this through the release server,
# or Actions -> this workflow -> Run workflow) -> the Test version goes LIVE for everyone:
#   - the app: the "latest" (Test) release build is copied to the "live" release
#   - the screens: gh-pages /preview/ is copied to /  (the site is published from gh-pages)
on:
  push:
    paths: ['index.html', 'manifest.json', 'icon-192.png', 'icon-512.png']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: story-screens
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Open the published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            git worktree add --detach site origin/gh-pages
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rfq .
          fi
          touch site/.nojekyll
          # First run only: live starts as exactly what main serves today.
          if [ ! -f site/index.html ]; then
            git archive origin/main index.html manifest.json icon-192.png icon-512.png | tar -x -C site
            echo "main $(git rev-parse --short origin/main)" > site/live-source.txt
          fi
      - name: New upload -> Test channel
        if: github.event_name == 'push'
        run: |
          mkdir -p site/preview
          cp index.html manifest.json icon-192.png icon-512.png site/preview/
          echo "${GITHUB_REF_NAME} ${GITHUB_SHA::7}" > site/preview/source.txt
          git -C site add -A
          git -C site commit -qm "Test channel: ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" || echo "Nothing new"
          git -C site push origin HEAD:gh-pages
          echo "### On the Test channel now: ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          echo "Check it on the owner's phone (Test channel), then tap **Publish live update** in STORY." >> "$GITHUB_STEP_SUMMARY"
      - name: Approve -> the Test app build goes live for everyone
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p promote
          gh release download latest -p app-debug.apk -p version.json -D promote --clobber
          N=$(grep -o '[0-9]\+' promote/version.json)
          if gh release view live >/dev/null 2>&1; then
            # APK first, then version.json, so phones never see a new version number before its APK.
            gh release upload live promote/app-debug.apk --clobber
            gh release upload live promote/version.json --clobber
            gh release edit live --title "STORY live build $N" --latest
          else
            gh release create live promote/app-debug.apk promote/version.json --title "STORY live build $N" --notes "Live channel: the STORY build every user gets" --latest
          fi
          echo "### Live app now: build $N" >> "$GITHUB_STEP_SUMMARY"
      - name: Approve -> Test screens go live for everyone
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ ! -f site/preview/index.html ]; then
            echo "No Test screens yet - live screens unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp site/preview/index.html site/preview/manifest.json site/preview/icon-192.png site/preview/icon-512.png site/
          cp site/preview/source.txt site/live-source.txt
          git -C site add -A
          git -C site commit -qm "Approved for live: $(cat site/live-source.txt)" || echo "Live already matches Test"
          git -C site push origin HEAD:gh-pages
          echo "### Live now: $(cat site/live-source.txt)" >> "$GITHUB_STEP_SUMMARY"
