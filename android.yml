name: Build STORY APK
on:
  push:
    paths-ignore: ['index.html', '*.md', 'release.json', 'release-worker.js', 'screens.yml', '.github/workflows/screens.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange the flat files into an Android project
        run: |
          B=build_src
          M=$B/app/src/main
          mkdir -p $M/java/com/story/launcher $M/res/values $M/res/xml $M/res/drawable $M/assets
          cp AndroidManifest.xml $M/
          cp *.kt $M/java/com/story/launcher/
          cp accessibility_config.xml $M/res/xml/
          cp strings.xml themes.xml $M/res/values/
          cp ic_launcher.xml $M/res/drawable/
          cp index.html $M/assets/index.html
          cat > $B/settings.gradle.kts <<'X'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "StoryOverlay"
          include(":app")
          X
          cat > $B/build.gradle.kts <<'X'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          X
          cat > $B/gradle.properties <<'X'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          android.suppressUnsupportedCompileSdk=36
          X
          cat > $B/app/build.gradle.kts <<'X'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.story.launcher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.story.launcher"
                  minSdk = 26
                  targetSdk = 37
                  versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt() + 100
                  versionName = "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              // Every build MUST be signed with the same key (debug.keystore.b64), or phones refuse the update.
              signingConfigs {
                  create("story") {
                      storeFile = rootProject.file("story.keystore")
                      storePassword = "android"; keyAlias = "androiddebugkey"; keyPassword = "android"
                  }
              }
              buildTypes { getByName("debug") { signingConfig = signingConfigs.getByName("story") } }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.biometric:biometric:1.1.0")
              implementation("androidx.webkit:webkit:1.11.0")
          }
          X
      - name: Use one fixed signing key so updates install over the old version
        run: |
          mkdir -p ~/.android
          base64 -d debug.keystore.b64 > ~/.android/debug.keystore
          base64 -d debug.keystore.b64 > build_src/story.keystore
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Build
        working-directory: build_src
        run: gradle assembleDebug --no-daemon
      - name: Check the APK can update the phones (same key, higher version)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=build_src/app/build/outputs/apk/debug/app-debug.apk
          WANT=fc583323c0e7c386ff9388fbf1a033c0b1dd5962ceb523caee58cc5dadbb3569
          GOT=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 'certificate SHA-256' | awk '{print $NF}')
          echo "Signed with: $GOT"
          [ "$GOT" = "$WANT" ] || { echo "::error::APK is signed with the wrong key ($GOT). Phones would say 'App not installed'."; exit 1; }
          VC=$("$BT/aapt2" dump badging "$APK" | grep -o "versionCode='[0-9]*'" | grep -o '[0-9]\+')
          PUB=$(curl -sfL "https://github.com/$GITHUB_REPOSITORY/releases/download/latest/version.json" | grep -o '[0-9]\+' || echo 0)
          echo "This build: $VC   Published now: $PUB"
          [ "$VC" -gt "$PUB" ] || { echo "::error::versionCode $VC is not higher than the published $PUB."; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: story-apk
          path: build_src/app/build/outputs/apk/debug/app-debug.apk
      # Test channel = the "latest" release: the owner's phone installs every main build by itself.
      # Live channel = the "live" release: only changes when the owner publishes (screens.yml).
      - name: Publish this build to the Test channel
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$((GITHUB_RUN_NUMBER + 100))
          cp build_src/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          echo "{\"versionCode\": $N}" > version.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app-debug.apk version.json --title "STORY test build $N" --notes "Test channel: newest STORY build (owner's phone)" --latest=false
          # First time only: start the Live channel with this build.
          gh release view live >/dev/null 2>&1 || gh release create live app-debug.apk version.json --title "STORY live build $N" --notes "Live channel: the STORY build every user gets" --latest
